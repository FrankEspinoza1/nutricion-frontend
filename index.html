<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicios | Nutrición Sin Enredos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container py-5">
  <h1 class="h3 verde mb-1">Gestión de servicios</h1>
  <p class="text-secondary mb-4">Nutrición Sin Enredos &middot; Grupo 2 &middot; Evidencia 3</p>

  <div class="row g-4">

    <!-- Formulario: crear y editar -->
    <div class="col-lg-4">
      <div class="tarjeta">
        <h2 class="h6 mb-3" id="tituloForm">Nuevo servicio</h2>

        <input type="hidden" id="idServicio">

        <div class="mb-3">
          <label class="form-label small">Nombre</label>
          <input type="text" id="nombre" class="form-control" placeholder="Cambio corporal">
        </div>
        <div class="mb-3">
          <label class="form-label small">Categoría</label>
          <input type="text" id="categoria" class="form-control" placeholder="Plan alimenticio">
        </div>
        <div class="mb-3">
          <label class="form-label small">Descripción</label>
          <input type="text" id="descripcion" class="form-control" placeholder="Plan personalizado">
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small">Precio (S/)</label>
            <input type="number" id="precio" class="form-control" placeholder="120">
          </div>
          <div class="col-6">
            <label class="form-label small">Duración (min)</label>
            <input type="number" id="duracion" class="form-control" placeholder="45">
          </div>
        </div>

        <button class="btn btn-verde w-100" id="btnGuardar">Guardar</button>
        <button class="btn btn-outline-secondary w-100 mt-2 d-none" id="btnCancelar">Cancelar</button>

        <div id="aviso" class="small mt-3"></div>
      </div>
    </div>

    <!-- Tabla: listar, editar y eliminar -->
    <div class="col-lg-8">
      <div class="tarjeta">
        <h2 class="h6 mb-3">Servicios registrados</h2>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr class="small text-secondary">
                <th>Nombre</th><th>Categoría</th><th>Descripción</th><th>Precio</th><th>Duración</th><th></th>
              </tr>
            </thead>
            <tbody id="tabla">
              <tr><td colspan="6" class="text-secondary small">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
